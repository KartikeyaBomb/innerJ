services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: innerj
      POSTGRES_PASSWORD: innerj
      POSTGRES_DB: innerj
    ports:
      - "5432:5432"
    volumes:
      - innerj-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerj -d innerj"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - innerj-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  innerj-postgres:
  innerj-redis:
